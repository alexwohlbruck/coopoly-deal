<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Monopoly Deal</title>
    <meta name="description" content="Play Monopoly Deal online with friends" />
    <meta name="theme-color" content="#1a5c2e" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Monopoly Deal" />
    <script>
      // Collapse per-game URLs (/game/123456, /room/123456, /join/123456)
      // into a single :code placeholder before Umami sends them. Runs for
      // both auto-tracked pageviews and any explicit umami.track() calls.
      // Must be defined before the deferred Umami script fires.
      window.umamiBeforeSend = function (_type, payload) {
        if (payload && typeof payload.url === "string") {
          payload.url = payload.url.replace(
            /^\/(game|room|join)\/[^/?#]+/,
            "/$1/:code",
          );
        }
        return payload;
      };
    </script>
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="55098436-d592-4e49-b350-9b9b9a09d07b"
      data-before-send="umamiBeforeSend"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

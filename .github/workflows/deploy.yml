name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: alexwohlbruck/coopoly-deal:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: wohlbruck.dev
          username: alex
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker pull alexwohlbruck/coopoly-deal:latest
            docker stop coopoly-deal && docker rm coopoly-deal || true
            docker run -d --name coopoly-deal --restart unless-stopped -p 3000:3000 -e PORT=3000 alexwohlbruck/coopoly-deal:latest
            docker image prune -f
